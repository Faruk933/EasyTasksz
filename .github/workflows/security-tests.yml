name: Security tests

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - ".github/workflows/security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-security-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Run database security tests
        run: supabase test db supabase/tests/database/security_rls.test.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop