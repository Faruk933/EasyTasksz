name: Security tests

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - ".github/workflows/security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Run database security tests
        run: supabase test db supabase/tests/database/security_rls.test.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop