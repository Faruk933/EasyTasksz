name: Supabase Keepalive

on:
  schedule:
    # Daily DB-backed request, safely inside Supabase Free's 7-day inactivity window.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping database-backed public settings endpoint
        env:
          SUPABASE_URL: https://iewdxruivjwblsnsjicq.supabase.co
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --output /dev/null \
            "$SUPABASE_URL/functions/v1/public-settings"
