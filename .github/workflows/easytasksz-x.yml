name: EasyTasksz X/Buffer Automation

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      campaign_start_date:
        description: "Optional WAT campaign start date for this manual run (YYYY-MM-DD)"
        required: false
        type: string
      slot:
        description: "Optional slot for this manual run (1, 2, or 3)"
        required: false
        type: choice
        options: ["1", "2", "3"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      IMAGINEPRO_API_KEY: ${{ secrets.IMAGINEPRO_API_KEY }}
      IMAGINEPRO_API_KEY_2: ${{ secrets.IMAGINEPRO_API_KEY_2 }}
      IMAGINEPRO_API_KEY_3: ${{ secrets.IMAGINEPRO_API_KEY_3 }}
      IMAGINEPRO_API_KEY_4: ${{ secrets.IMAGINEPRO_API_KEY_4 }}
      IMAGINEPRO_API_KEY_5: ${{ secrets.IMAGINEPRO_API_KEY_5 }}
      IMAGINEPRO_API_KEY_6: ${{ secrets.IMAGINEPRO_API_KEY_6 }}
      IMAGINEPRO_API_KEY_7: ${{ secrets.IMAGINEPRO_API_KEY_7 }}
      IMAGINEPRO_API_KEY_8: ${{ secrets.IMAGINEPRO_API_KEY_8 }}
      IMAGINEPRO_API_KEY_9: ${{ secrets.IMAGINEPRO_API_KEY_9 }}
      IMAGINEPRO_API_KEY_10: ${{ secrets.IMAGINEPRO_API_KEY_10 }}
      CAMPAIGN_START_DATE_CONFIG: ${{ vars.CAMPAIGN_START_DATE || secrets.CAMPAIGN_START_DATE || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish one X, Instagram, and Threads post through Buffer
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_START_DATE: ${{ inputs.campaign_start_date }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs/promises');
          const { execFileSync } = require('node:child_process');
          const BUFFER_ENDPOINT = 'https://api.buffer.com/';
          const CAMPAIGN_FILE = 'automation/campaign_start_date.txt';
          const POSTS_FILE = 'automation/x-posts.json';
          const GENERATED_IMAGE_FILE = 'automation/generated-image-url.txt';
          const requiredEnv = ['BUFFER_API_KEY', 'GITHUB_TOKEN', 'REPOSITORY'];
          for (const name of requiredEnv) if (!process.env[name]) throw new Error(`Missing required environment variable: ${name}`);

          function assertDate(value, label) { if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) throw new Error(`${label} must be YYYY-MM-DD`); }
          function watDate() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Lagos', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
          function dateDiffDays(start, end) { return Math.floor((Date.parse(`${end}T00:00:00Z`) - Date.parse(`${start}T00:00:00Z`)) / 86400000); }

          async function readCampaignStart() {
            if (process.env.EVENT_NAME !== 'workflow_dispatch') {
              try { const value = (await fs.readFile(CAMPAIGN_FILE, 'utf8')).trim(); if (value) { assertDate(value, CAMPAIGN_FILE); return value; } }
              catch (error) { if (error.code !== 'ENOENT') throw error; }
            }
            if (process.env.MANUAL_START_DATE) { assertDate(process.env.MANUAL_START_DATE, 'campaign_start_date input'); return process.env.MANUAL_START_DATE; }
            if (process.env.CAMPAIGN_START_DATE_CONFIG) { assertDate(process.env.CAMPAIGN_START_DATE_CONFIG, 'CAMPAIGN_START_DATE'); return process.env.CAMPAIGN_START_DATE_CONFIG; }
            return watDate();
          }

          async function bufferGraphQL(query, variables = {}, includeResponse = false) {
            const response = await fetch(BUFFER_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${process.env.BUFFER_API_KEY}` }, body: JSON.stringify({ query, variables }) });
            const body = await response.json();
            if (!response.ok || body.errors?.length) throw new Error(`Buffer API error (HTTP ${response.status}): ${JSON.stringify(body.errors || body)}`);
            return includeResponse ? { data: body.data, httpStatus: response.status } : body.data;
          }

          async function findChannel(service, label) {
            const accountData = await bufferGraphQL(`query { account { organizations { id } } }`);
            const organizations = accountData.account?.organizations || [];
            if (!organizations.length) throw new Error('No Buffer organization found');
            const query = `query ($input: ChannelsInput!) { channels(input: $input) { id name service isDisconnected organizationId } }`;
            for (const organization of organizations) {
              const data = await bufferGraphQL(query, { input: { organizationId: organization.id } });
              const channel = (data.channels || []).find(c => !c.isDisconnected && c.service === service);
              if (channel) return channel;
            }
            throw new Error(`No connected ${label} Buffer channel found`);
          }

          async function getQueuedPosts(channelId, organizationId) {
            const data = await bufferGraphQL(`query ($input: PostsInput!, $first: Int) { posts(input: $input, first: $first) { edges { node { text } } } }`, { input: { organizationId, filter: { channelIds: [channelId], status: ['scheduled'] } }, first: 100 });
            return data.posts?.edges?.map(edge => edge.node?.text).filter(Boolean) || [];
          }

          async function createPost(channelId, text, imageUrl, service) {
            const response = await bufferGraphQL(`mutation ($input: CreatePostInput!) { createPost(input: $input) { __typename ... on PostActionSuccess { post { id status dueAt channelId text assets { id mimeType } } } ... on MutationError { message } } }`, { input: { channelId, text, assets: [{ image: { url: imageUrl } }], mode: 'addToQueue', schedulingType: 'automatic', needsApproval: false, ...(service === 'instagram' ? { metadata: { instagram: { type: 'post', shouldShareToFeed: true } } } : {}) } }, true);
            const result = response.data?.createPost;
            console.log(`Buffer ${service} createPost response: ${JSON.stringify(result)}`);
            if (!result || result.__typename !== 'PostActionSuccess') throw new Error(`Buffer ${service} createPost failed: ${JSON.stringify(result)}`);
            const post = result.post;
            if (!post?.id || post.status !== 'scheduled' || post.channelId !== channelId || post.text !== text || !post.dueAt || !Array.isArray(post.assets) || !post.assets.length) throw new Error(`Buffer ${service} returned an invalid scheduled post: ${JSON.stringify(post)}`);
            return post;
          }

          (async () => {
            const posts = JSON.parse(require('node:fs').readFileSync(POSTS_FILE, 'utf8'));
            if (!Array.isArray(posts) || posts.length !== 90) throw new Error('Expected exactly 90 posts');
            const campaignStart = await readCampaignStart();
            const day = dateDiffDays(campaignStart, watDate()) + 1;
            if (day < 1 || day > 30) throw new Error(`Campaign day ${day} is outside 1-30`);
            let slot;
            if (process.env.EVENT_NAME === 'workflow_dispatch' && process.env.MANUAL_SLOT) slot = Number(process.env.MANUAL_SLOT);
            else slot = ({ '0 7 * * *': 1, '0 12 * * *': 2, '0 17 * * *': 3 })[process.env.EVENT_SCHEDULE];
            if (![1, 2, 3].includes(slot)) throw new Error(`Unable to determine slot from workflow event: ${process.env.EVENT_NAME}`);
            const post = posts.find(p => p.day === day && p.slot === slot);
            if (!post || typeof post.text !== 'string') throw new Error(`No post found for day ${day}, slot ${slot}`);

            const [xChannel, instagramChannel, threadsChannel] = await Promise.all([
              findChannel('twitter', 'X/Twitter'),
              findChannel('instagram', 'Instagram'),
              findChannel('threads', 'Threads')
            ]);
            console.log(`X channel found: ${xChannel.name}`);
            console.log(`Instagram channel found: ${instagramChannel.name}`);
            console.log(`Threads channel found: ${threadsChannel.name}`);
            const [xQueued, instagramQueued, threadsQueued] = await Promise.all([
              getQueuedPosts(xChannel.id, xChannel.organizationId),
              getQueuedPosts(instagramChannel.id, instagramChannel.organizationId),
              getQueuedPosts(threadsChannel.id, threadsChannel.organizationId)
            ]);
            const xDuplicate = xQueued.includes(post.text);
            const instagramDuplicate = instagramQueued.includes(post.text);
            const threadsDuplicate = threadsQueued.includes(post.text);
            if (xDuplicate && instagramDuplicate && threadsDuplicate) { console.log(`Identical post already queued on X, Instagram, and Threads; skipping day ${day}, slot ${slot}.`); return; }

            console.log('Generating fresh EasyTasksz image with ImaginePro...');
            execFileSync('node', ['automation/generate-image.js', post.text], { stdio: 'inherit' });
            const imageUrl = (await fs.readFile(GENERATED_IMAGE_FILE, 'utf8')).trim();
            if (!imageUrl || !/^https?:\/\//i.test(imageUrl)) throw new Error('ImaginePro did not produce a valid public image URL.');
            console.log('One generated image will be used for X, Instagram, and Threads.');

            const results = [];
            if (!xDuplicate) {
              try { const created = await createPost(xChannel.id, post.text, imageUrl, 'twitter'); results.push(`X scheduled (${created.id})`); }
              catch (error) { results.push(`X FAILED: ${error.message}`); }
            } else results.push('X already queued');

            if (!instagramDuplicate) {
              try { const created = await createPost(instagramChannel.id, post.text, imageUrl, 'instagram'); results.push(`Instagram scheduled (${created.id})`); }
              catch (error) { results.push(`Instagram FAILED: ${error.message}`); }
            } else results.push('Instagram already queued');

            if (!threadsDuplicate) {
              try { const created = await createPost(threadsChannel.id, post.text, imageUrl, 'threads'); results.push(`Threads scheduled (${created.id})`); }
              catch (error) { results.push(`Threads FAILED: ${error.message}`); }
            } else results.push('Threads already queued');

            console.log(`Campaign day ${day}, slot ${slot} result: ${results.join(' | ')}`);
            if (results.some(result => result.includes('FAILED'))) process.exitCode = 1;
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
